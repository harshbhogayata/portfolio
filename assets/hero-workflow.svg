<svg class="engineer-art-svg" viewBox="0 0 712 622" role="img" aria-labelledby="engineer-art-title engineer-art-description" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<title id="engineer-art-title">Design. Build. Ship.</title>
<desc id="engineer-art-description">Harsh's HB monogram, constructed from overlapping cobalt planes, translucent folds, a lime joining panel, and fine orbital construction lines.</desc>
